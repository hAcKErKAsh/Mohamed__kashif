services:
  dev:
    image: mcr.microsoft.com/devcontainers/rust:1-bookworm
    volumes: ["../..:/workspaces:cached"]
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://lyceum:lyceum_dev_only@db/lyceum
      BIND: 0.0.0.0:8080
      STATIC_DIR: ../web/dist
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lyceum
      POSTGRES_PASSWORD: lyceum_dev_only
      POSTGRES_DB: lyceum
