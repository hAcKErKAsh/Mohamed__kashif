# One command to run the full stack locally:  docker compose up --build
# Then open http://localhost:8080 and sign in as admin@northfield.school / Northfield#2026
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lyceum
      POSTGRES_PASSWORD: lyceum_dev_only
      POSTGRES_DB: lyceum
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyceum"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://lyceum:lyceum_dev_only@db/lyceum
      SEED_DEMO: "1"
    ports: ["8080:8080"]
volumes:
  pgdata:
